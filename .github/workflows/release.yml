name: Release

# Two ways in:
#   1. Push to main - the tag job reads VERSION and tags if that version is new.
#   2. Push a v* tag by hand - the tag job is skipped, goreleaser runs directly.
#
# So an ordinary merge ships nothing. Bumping VERSION is what cuts a release,
# which keeps a repo that takes several commits a day from publishing several
# casks a day.
on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite runs BEFORE the tag is pushed, and the tap token is checked
      # before that. Both exist because of the shape of this workflow: the tag
      # job pushes a tag and a SEPARATE job releases it, so anything that fails
      # after the push leaves the tag burnt. The next run then reads "Tag v0.1.0
      # already exists - nothing to release", and recovery is a manual tag
      # delete or a version number that was never released.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: The tap token must exist before a tag is pushed
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set; goreleaser would fail AFTER the tag was pushed" >&2
            exit 1
          fi

      - run: make check

      - id: tag
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error file=VERSION::VERSION must be a semver string like 1.2.3, got '${version}'"
            exit 1
          fi

          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists - nothing to release. Bump VERSION to ship."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: [tag]
    # A tag pushed with the default GITHUB_TOKEN cannot trigger a new workflow
    # run, so the release has to happen in this same run. always() is needed
    # because the tag job is skipped on the manual-tag path.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the cask to jschell12/homebrew-tap. The default GITHUB_TOKEN
          # cannot reach another repository, so this is a separate PAT and the
          # release fails loudly without it rather than shipping a release with
          # no way to install it.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
